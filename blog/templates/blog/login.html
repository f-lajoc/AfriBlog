{% extends 'blog/base.html' %}
{% block content %}
<div class="auth-wrapper fade-in">
    <h2>Sign In</h2>
    <form method="POST" class="editorial-form">
        {% csrf_token %}
        {{ form.as_p }}
        <button type="submit" class="btn-submit-comment">Sign In</button>
    </form>
    <p class="auth-helper">New voice? <a href="{% url 'register' %}">Create an account here</a></p>
    
</div>
{% endblock %}
