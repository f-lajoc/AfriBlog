{% extends 'blog/base.html' %}
{% block content %}

<div class="auth-wrapper fade-in">

    <h2>
        <i class="fas fa-right-to-bracket icon"></i>
        Sign In
    </h2>

    <form method="POST" class="editorial-form">

        {% csrf_token %}

        <div class="form-heading">
            <i class="fas fa-user-lock icon"></i>
            Welcome back
        </div>

        {{ form.as_p }}

        <button type="submit" class="btn-submit-comment">
            <i class="fas fa-sign-in-alt icon"></i>
            Sign In
        </button>

    </form>

    <p class="auth-helper">
        <i class="fas fa-feather icon"></i>
        New voice?
        <a href="{% url 'register' %}">
            Create an account here
        </a>
    </p>

</div>

{% endblock %}
