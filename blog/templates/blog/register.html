{% extends 'blog/base.html' %}
{% block content %}

<div class="auth-wrapper fade-in">

    <h2>
        <i class="fas fa-user-plus icon"></i>
        Register Author Profile
    </h2>

    <form method="POST" class="editorial-form">

        {% csrf_token %}

        <div class="form-heading">
            <i class="fas fa-feather icon"></i>
            Join AfriBlog as a writer
        </div>

        {{ form.as_p }}

        <button type="submit" class="btn-submit-comment">
            <i class="fas fa-user-check icon"></i>
            Register Account
        </button>

    </form>

    <p class="auth-helper">
        <i class="fas fa-right-to-bracket icon"></i>
        Already registered?
        <a href="{% url 'login' %}">
            Login here
        </a>
    </p>

</div>

{% endblock %}
