{% extends 'blog/base.html' %}
{% block content %}
<div class="auth-wrapper fade-in text-center">
    <h2>Confirm Deletion</h2>
    <p>Are you absolutely sure you want to permanently delete <span><strong>"{{ object.title }}"</strong>? This action cannot be undone.</span></p>
    <form method="POST">
        {% csrf_token %}
        <button type="submit" class="btn-delete-action" style="width:100%; margin-bottom:1rem;">Confirm Delete</button>
        <a href="{% url 'index' %}" class="btn-cancel" style="display:block;">Cancel</a>
    </form>
</div>
{% endblock %}
